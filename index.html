<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Object Counter</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center}
#wrap{position:relative;display:inline-block;width:100%;max-width:900px}
video,canvas{width:100%;border-radius:12px}
canvas{position:absolute;top:0;left:0}
#counts{padding:12px;font-size:18px;font-weight:700}
button{padding:12px 20px;margin:15px;border-radius:8px;border:0;background:#00e676;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<h2>Live Object Counter </h2>
<button id="start">Start Camera</button>
<div id="counts">Waiting...</div>
<div id="wrap"><video id="v" autoplay muted playsinline></video><canvas id="c"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script>
const video=document.getElementById('v'), canvas=document.getElementById('c'), ctx=canvas.getContext('2d'), countsEl=document.getElementById('counts'), btn=document.getElementById('start');
let model;
btn.onclick=async()=>{
  btn.style.display='none'; countsEl.textContent='Loading AI...';
  model=await cocoSsd.load();
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  video.srcObject=s;
  video.onloadedmetadata=()=>{canvas.width=video.videoWidth;canvas.height=video.videoHeight;detect();}
};
async function detect(){
  const preds=await model.detect(video);
  ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const counter={}; preds.forEach(p=>{counter[p.class]=(counter[p.class]||0)+1; ctx.strokeStyle='#00e676';ctx.lineWidth=3;ctx.strokeRect(p.bbox[0],p.bbox[1],p.bbox[2],p.bbox[3]); ctx.fillStyle='#00e676';ctx.fillRect(p.bbox[0],p.bbox[1]-20,p.bbox[2],20); ctx.fillStyle='#000';ctx.font='14px system-ui';ctx.fillText(p.class+' '+(p.score*100|0)+'%',p.bbox[0]+5,p.bbox[1]-5);});
  const text=Object.entries(counter).map(([k,v])=>`${k}: ${v}`).join(' | ')||'No objects'; countsEl.textContent=text+` | Total: ${preds.length}`;
  requestAnimationFrame(detect);
}
</script>
</body>
</html>
